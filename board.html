
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>게시판</title>
<style>
body {font-family:sans-serif;}
.grid {display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:20px;}
.card {background:#fff; padding:10px;}
</style>
</head>
<body>

<nav>
<a href="index.html">홈</a>
<a href="board.html">게시판</a>
</nav>

<h2 style="padding:20px;">게시판</h2>

<div class="grid" id="list"></div>

<script>
let data = JSON.parse(localStorage.getItem("posts")||"[]");

list.innerHTML = data.map(p=>`
<div class="card">
<img src="${p.img}" style="width:100%">
<h4>${p.title}</h4>
<p>${p.date}</p>
</div>
`).join('');
</script>

</body>
</html>
