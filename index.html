<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정읍문화소식</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .hero {
      background: linear-gradient(135deg, #6d4cff, #8b5cf6);
      color: #fff;
      padding: 28px 24px;
      border-radius: 18px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(109, 76, 255, 0.18);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 800;
    }

    .hero p {
      margin: 0;
      font-size: 15px;
      opacity: 0.92;
    }

    .panel {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      margin-bottom: 24px;
    }

    .panel h2,
    .panel h3 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    input[type="text"],
    textarea,
    input[type="file"] {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus,
    input[type="file"]:focus {
      outline: none;
      border-color: #6d4cff;
      box-shadow: 0 0 0 4px rgba(109, 76, 255, 0.12);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #6d4cff;
      color: #fff;
      flex: 1;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
      min-width: 110px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-head h3 {
      margin: 0;
      font-size: 22px;
    }

    .section-note {
      font-size: 13px;
      color: #6b7280;
    }

    .post-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .post-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .post-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .post-image,
    .post-empty {
      width: 100%;
      height: 190px;
      display: block;
    }

    .post-image {
      object-fit: cover;
      background: #e5e7eb;
    }

    .post-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 14px;
    }

    .post-body {
      padding: 14px;
    }

    .post-title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 8px;
      color: #111827;
    }

    .post-date {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .post-text {
      font-size: 14px;
      color: #374151;
      line-height: 1.5;
    }

    .list-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .list-item {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
    }

    .list-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .list-title {
      font-size: 16px;
      font-weight: 800;
      color: #111827;
    }

    .list-date {
      font-size: 13px;
      color: #6b7280;
      white-space: nowrap;
    }

    .list-content {
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
    }

    .empty {
      padding: 18px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      color: #6b7280;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 1024px) {
      .post-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .post-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 26px;
      }

      .actions {
        flex-direction: column;
      }

      .btn-secondary {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 16px 12px 40px;
      }

      .hero {
        padding: 22px 18px;
      }

      .post-grid {
        grid-template-columns: 1fr;
      }

      .list-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>정읍문화소식</h1>
      <p>정읍의 문화, 행사, 이야기들을 한곳에서 모아보는 소식 공간입니다.</p>
    </section>

    <section class="panel">
      <h2>소식 올리기</h2>

      <div class="form-grid">
        <div class="field full">
          <label for="title">제목</label>
          <input type="text" id="title" placeholder="예: 정읍 봄 전시회 개최">
        </div>

        <div class="field full">
          <label for="content">내용</label>
          <textarea id="content" placeholder="행사 내용, 장소, 시간, 소개글 등을 적어주세요."></textarea>
        </div>

        <div class="field full">
          <label for="imageInput">대표 이미지</label>
          <input type="file" id="imageInput" accept="image/*">
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary" onclick="uploadPost()">게시글 등록</button>
        <button class="btn-secondary" onclick="resetForm()">다시쓰기</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h3>메인 노출 소식 8개</h3>
        <div class="section-note">최신 등록순으로 8개가 먼저 보입니다.</div>
      </div>
      <div id="topPosts" class="post-grid"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h3>전체 소식 목록</h3>
        <div class="section-note">메인에 안 걸린 글도 여기에서 모두 볼 수 있습니다.</div>
      </div>
      <div id="allPosts" class="list-wrap"></div>
    </section>
  </div>

  <script>
    async function uploadImageToR2(file) {
      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch("https://jeongeup-upload.nockd61.workers.dev", {
        method: "POST",
        body: formData
      });

      const result = await res.json();

      if (!result.ok) {
        alert("업로드 실패");
        return null;
      }

      return result.url;
    }

    function getPosts() {
      return JSON.parse(localStorage.getItem("posts") || "[]");
    }

    function savePosts(posts) {
      localStorage.setItem("posts", JSON.stringify(posts));
    }

    function formatDate(dateString) {
      const d = new Date(dateString);
      if (isNaN(d)) return "";
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hour = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${year}-${month}-${day} ${hour}:${min}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderPosts() {
      const posts = getPosts();
      const topPostsEl = document.getElementById("topPosts");
      const allPostsEl = document.getElementById("allPosts");

      if (posts.length === 0) {
        topPostsEl.innerHTML = '<div class="empty">등록된 소식이 아직 없습니다.</div>';
        allPostsEl.innerHTML = '<div class="empty">등록된 소식이 아직 없습니다.</div>';
        return;
      }

      const top8 = posts.slice(0, 8);

      topPostsEl.innerHTML = top8.map(post => `
        <article class="post-card">
          ${
            post.image
              ? `<img class="post-image" src="${post.image}" alt="${escapeHtml(post.title)}">`
              : `<div class="post-empty">이미지 없음</div>`
          }
          <div class="post-body">
            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="post-date">${formatDate(post.date)}</div>
            <div class="post-text">${escapeHtml(post.content).slice(0, 60)}${post.content.length > 60 ? "..." : ""}</div>
          </div>
        </article>
      `).join("");

      allPostsEl.innerHTML = posts.map((post, index) => `
        <div class="list-item">
          <div class="list-top">
            <div class="list-title">${index + 1}. ${escapeHtml(post.title)}</div>
            <div class="list-date">${formatDate(post.date)}</div>
          </div>
          <div class="list-content">${escapeHtml(post.content)}</div>
        </div>
      `).join("");
    }

    async function uploadPost() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const file = document.getElementById("imageInput").files[0];

      if (!title || !content) {
        alert("제목과 내용을 입력하세요");
        return;
      }

      let imageUrl = "";

      if (file) {
        imageUrl = await uploadImageToR2(file);
        if (file && !imageUrl) return;
      }

      const post = {
        id: Date.now(),
        title,
        content,
        image: imageUrl,
        date: new Date().toISOString()
      };

      const posts = getPosts();
      posts.unshift(post);
      savePosts(posts);

      resetForm();
      renderPosts();
      alert("등록 완료!");
    }

    function resetForm() {
      document.getElementById("title").value = "";
      document.getElementById("content").value = "";
      document.getElementById("imageInput").value = "";
    }

    renderPosts();
  </script>
</body>
</html>
