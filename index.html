<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정읍문화소식</title>

<style>
body {
  font-family: sans-serif;
  background: #f4f4f4;
  margin: 0;
}

.header {
  background: linear-gradient(135deg, #6d4cff, #8b5cf6);
  color: white;
  padding: 30px;
  text-align: center;
}

.container {
  max-width: 1100px;
  margin: 20px auto;
}

.form-box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: #6d4cff;
  color: white;
  padding: 12px;
  border: none;
  margin-top: 10px;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-body {
  padding: 10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>정읍문화소식</h1>
  <p>정읍의 문화, 행사, 이야기 플랫폼</p>
</div>

<div class="container">

  <!-- 글쓰기 -->
  <div class="form-box">
    <input id="title" placeholder="제목">
    <textarea id="content" placeholder="내용"></textarea>
    <input type="file" id="imageInput">
    <button onclick="uploadPost()">게시글 등록</button>
  </div>

  <!-- 메인 8개 -->
  <h3>메인 노출 8개</h3>
  <div id="mainPosts" class="grid"></div>

  <!-- 전체 목록 -->
  <h3>전체 소식</h3>
  <div id="allPosts"></div>

</div>

<script>
// 🔥 R2 업로드
async function uploadImageToR2(file) {
  const formData = new FormData();
  formData.append("file", file);

  const res = await fetch("https://jeongeup-upload.nockd61.workers.dev", {
    method: "POST",
    body: formData
  });

  const result = await res.json();

  if (!result.ok) {
    alert("업로드 실패");
    return null;
  }

  return result.url; // 👉 URL만 반환
}

// 🔥 게시글 등록
async function uploadPost() {
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  const file = document.getElementById("imageInput").files[0];

  if (!title || !content) {
    alert("제목과 내용 입력");
    return;
  }

  let imageUrl = "";

  if (file) {
    imageUrl = await uploadImageToR2(file); // 👉 R2 업로드
  }

  const post = {
    title,
    content,
    image: imageUrl, // 👉 URL만 저장
    date: new Date().toISOString()
  };

  let posts = JSON.parse(localStorage.getItem("posts") || "[]");
  posts.unshift(post);

  localStorage.setItem("posts", JSON.stringify(posts));

  alert("등록 완료!");
  location.reload();
}

// 🔥 화면 렌더링
function renderPosts() {
  const posts = JSON.parse(localStorage.getItem("posts") || "[]");

  const main = document.getElementById("mainPosts");
  const all = document.getElementById("allPosts");

  main.innerHTML = "";
  all.innerHTML = "";

  posts.slice(0, 8).forEach(p => {
    main.innerHTML += `
      <div class="card">
        <img src="${p.image}">
        <div class="card-body">
          <b>${p.title}</b>
          <p>${p.content}</p>
        </div>
      </div>
    `;
  });

  posts.forEach(p => {
    all.innerHTML += `
      <div class="card">
        <div class="card-body">
          <b>${p.title}</b> - ${p.content}
        </div>
      </div>
    `;
  });
}

renderPosts();
</script>

</body>
</html>
