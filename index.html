<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정읍문화소식</title>
  <style>
    * { box-sizing: border-box; }
    :root{
      --bg:#f4f5f7;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --brand:#6d4cff;
      --brand2:#8b5cf6;
      --shadow:0 12px 30px rgba(15,23,42,.08);
      --radius:18px;
    }
    body{
      margin:0;
      font-family:"Noto Sans KR", Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px 16px 60px;
    }
    .hero{
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff;
      padding:24px;
      border-radius:24px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }
    .hero h1{margin:0 0 6px;font-size:38px;}
    .hero p{margin:0;opacity:.92}
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }
    .nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .nav button,.btn{
      border:none;
      border-radius:12px;
      background:#fff;
      color:var(--text);
      padding:10px 14px;
      cursor:pointer;
      box-shadow:0 4px 12px rgba(15,23,42,.05);
      font-weight:700;
    }
    .nav button.active,.btn-primary{
      background:var(--brand);
      color:#fff;
    }
    .grid{
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:18px;
      align-items:start;
    }
    .panel{
      background:var(--card);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px;
      margin-bottom:18px;
    }
    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }
    .section-head h2,.section-head h3{
      margin:0;
      font-size:24px;
    }
    .muted{color:var(--muted);font-size:14px;}
    .featured-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:#fff;
      cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease;
    }
    .card:hover{transform:translateY(-2px); box-shadow:0 10px 20px rgba(15,23,42,.08);}
    .card img,.thumb-empty{
      width:100%;
      height:190px;
      object-fit:cover;
      display:block;
      background:#eef2f7;
    }
    .thumb-empty{
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:14px;
    }
    .card-body{padding:12px;}
    .badge{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      background:#f1edff;
      color:var(--brand);
      font-size:12px;
      font-weight:700;
      margin-bottom:8px;
    }
    .title{
      font-size:16px;
      font-weight:800;
      line-height:1.4;
      margin-bottom:6px;
    }
    .meta{
      font-size:13px;
      color:var(--muted);
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .list-item{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:14px;
      cursor:pointer;
    }
    .list-item:hover{background:#fafafa;}
    .list-title{font-weight:800;margin-bottom:6px;}
    .preview-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .small-post{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      cursor:pointer;
    }
    .small-post:hover{background:#fafafa;}
    .empty{
      padding:22px;
      border:1px dashed #d4d4d8;
      border-radius:16px;
      color:var(--muted);
      text-align:center;
    }
    .field{margin-bottom:12px;}
    .field label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:6px;
    }
    .field input,.field textarea,.field select{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      font:inherit;
      background:#fff;
    }
    .field textarea{min-height:140px; resize:vertical;}
    .actions{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .actions button{
      border:none; border-radius:12px; padding:12px 16px; cursor:pointer; font-weight:700;
    }
    .primary{background:var(--brand);color:#fff;}
    .secondary{background:#eef2f7;color:#111827;}
    .danger{background:#ef4444;color:#fff;}
    .tabs{
      display:none;
    }
    .tabs.active{display:block;}
    .search-row{
      display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;
    }
    .search-row input{
      flex:1; min-width:220px;
      border:1px solid var(--line); border-radius:12px; padding:12px;
    }
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.45);
      display:none; align-items:center; justify-content:center; padding:16px; z-index:999;
    }
    .modal-backdrop.show{display:flex;}
    .modal{
      width:min(900px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:22px;
      box-shadow:0 20px 40px rgba(0,0,0,.25);
      padding:20px;
    }
    .modal-close{
      float:right; border:none; background:#f3f4f6; border-radius:10px; width:38px; height:38px; cursor:pointer;
    }
    .detail-image{
      width:100%; max-height:520px; object-fit:contain; background:#f4f4f4; border-radius:16px; margin:14px 0;
    }
    .admin-row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
    @media (max-width:1024px){
      .featured-grid{grid-template-columns:repeat(3,1fr);}
      .grid{grid-template-columns:1fr;}
    }
    @media (max-width:720px){
      .featured-grid{grid-template-columns:repeat(2,1fr);}
      .hero h1{font-size:30px;}
    }
    @media (max-width:480px){
      .featured-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>정읍문화소식</h1>
      <p>정읍의 문화, 행사, 이야기, 영상을 한곳에서 모아보는 소식 공간입니다.</p>
    </div>

    <div class="topbar">
      <div class="nav">
        <button class="nav-btn active" data-tab="homeTab">홈</button>
        <button class="nav-btn" data-tab="storyTab">문화이야기</button>
        <button class="nav-btn" data-tab="noticeTab">공지사항</button>
        <button class="nav-btn" data-tab="videoTab">영상행사</button>
        <button class="nav-btn" data-tab="uploadTab">소식올리기</button>
      </div>
      <div>
        <button class="btn" id="adminToggleBtn">관리자 로그인</button>
      </div>
    </div>

    <section id="homeTab" class="tabs active">
      <div class="panel">
        <div class="section-head">
          <h2>메인 노출 소식 8개</h2>
          <div class="muted">최신 등록순 8개가 먼저 보입니다.</div>
        </div>
        <div id="featuredGrid" class="featured-grid"></div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="section-head">
            <h3>전체 소식 목록</h3>
            <div class="muted">메인에 안 걸린 글도 여기에서 모두 볼 수 있습니다.</div>
          </div>
          <div id="allPostsList" class="list"></div>
        </div>

        <div>
          <div class="panel">
            <div class="section-head">
              <h3>공지사항</h3>
            </div>
            <div id="homeNotices" class="preview-list"></div>
          </div>

          <div class="panel">
            <div class="section-head">
              <h3>문화이야기</h3>
            </div>
            <div id="homeStories" class="preview-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="storyTab" class="tabs">
      <div class="panel">
        <div class="section-head">
          <h2>문화이야기</h2>
          <div class="muted">정읍 문화와 생활, 전시, 사람들의 이야기를 모읍니다.</div>
        </div>
        <div class="search-row">
          <input id="storySearch" type="text" placeholder="문화이야기 검색" />
          <button class="btn btn-primary" onclick="renderStories()">검색</button>
        </div>
        <div id="storyList" class="list"></div>
      </div>
    </section>

    <section id="noticeTab" class="tabs">
      <div class="panel">
        <div class="section-head">
          <h2>공지사항</h2>
          <div class="muted">운영자 공지와 중요한 안내를 올리는 공간입니다.</div>
        </div>
        <div id="noticeList" class="list"></div>
      </div>
    </section>

    <section id="videoTab" class="tabs">
      <div class="panel">
        <div class="section-head">
          <h2>영상행사</h2>
          <div class="muted">유튜브 링크를 등록해 영상 행사와 공연을 소개합니다.</div>
        </div>
        <div class="field">
          <label for="videoTitle">영상 제목</label>
          <input id="videoTitle" type="text" placeholder="예: 정읍 벚꽃축제 현장 스케치" />
        </div>
        <div class="field">
          <label for="videoUrl">유튜브 링크</label>
          <input id="videoUrl" type="text" placeholder="https://www.youtube.com/watch?v=..." />
        </div>
        <div class="field">
          <label for="videoDesc">설명</label>
          <textarea id="videoDesc" placeholder="영상 설명을 적어주세요."></textarea>
        </div>
        <div class="actions">
          <button class="primary" onclick="addVideo()">영상 등록</button>
          <button class="secondary" onclick="resetVideoForm()">다시쓰기</button>
        </div>
        <div style="height:18px"></div>
        <div id="videoList" class="list"></div>
      </div>
    </section>

    <section id="uploadTab" class="tabs">
      <div class="panel">
        <div class="section-head">
          <h2>소식올리기</h2>
          <div class="muted">시민이 직접 정읍 문화 소식을 올릴 수 있습니다.</div>
        </div>
        <div class="field">
          <label for="postType">분류</label>
          <select id="postType">
            <option value="news">소식</option>
            <option value="story">문화이야기</option>
            <option value="notice">공지사항</option>
          </select>
        </div>
        <div class="field">
          <label for="title">제목</label>
          <input id="title" type="text" placeholder="예: 정읍 봄 전시회 개최" />
        </div>
        <div class="field">
          <label for="place">장소</label>
          <input id="place" type="text" placeholder="예: 정읍문화원" />
        </div>
        <div class="field">
          <label for="author">작성자</label>
          <input id="author" type="text" placeholder="예: 시민 제보자" />
        </div>
        <div class="field">
          <label for="content">내용</label>
          <textarea id="content" placeholder="행사 내용, 장소, 시간, 소개글 등을 적어주세요."></textarea>
        </div>
        <div class="field">
          <label for="imageInput">대표 이미지</label>
          <input id="imageInput" type="file" accept="image/*" />
        </div>
        <div class="actions">
          <button class="primary" onclick="uploadPost()">게시글 등록</button>
          <button class="secondary" onclick="resetUploadForm()">다시쓰기</button>
        </div>
      </div>
    </section>
  </div>

  <div id="detailModal" class="modal-backdrop">
    <div class="modal">
      <button class="modal-close" onclick="closeDetail()">✕</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "1234";
    let isAdmin = false;

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(dateString) {
      const d = new Date(dateString);
      if (isNaN(d)) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const h = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${y}-${m}-${day} ${h}:${min}`;
    }

    function getData(key) {
      return JSON.parse(localStorage.getItem(key) || "[]");
    }

    function setData(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getPosts() { return getData("jm_posts"); }
    function setPosts(v) { setData("jm_posts", v); }

    function getStories() { return getData("jm_stories"); }
    function setStories(v) { setData("jm_stories", v); }

    function getNotices() { return getData("jm_notices"); }
    function setNotices(v) { setData("jm_notices", v); }

    function getVideos() { return getData("jm_videos"); }
    function setVideos(v) { setData("jm_videos", v); }

    async function uploadImageToR2(file) {
      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch("https://jeongeup-upload.nockd61.workers.dev", {
        method: "POST",
        body: formData
      });

      const result = await response.json();

      if (!result.ok) {
        alert("업로드 실패");
        return null;
      }

      return result.url;
    }

    function getYoutubeEmbed(url) {
      if (!url) return "";
      let videoId = "";
      if (url.includes("watch?v=")) videoId = url.split("watch?v=")[1].split("&")[0];
      else if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1].split("?")[0];
      else if (url.includes("shorts/")) videoId = url.split("shorts/")[1].split("?")[0];
      return videoId ? `https://www.youtube.com/embed/${videoId}` : "";
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tabs").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      document.querySelector(`.nav-btn[data-tab="${tabId}"]`).classList.add("active");
    }

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    document.getElementById("adminToggleBtn").addEventListener("click", () => {
      if (isAdmin) {
        isAdmin = false;
        alert("관리자 로그아웃 되었습니다.");
        renderAll();
        return;
      }
      const pw = prompt("관리자 비밀번호를 입력하세요");
      if (pw === ADMIN_PASSWORD) {
        isAdmin = true;
        alert("관리자 로그인 성공");
        renderAll();
      } else {
        alert("비밀번호가 다릅니다.");
      }
    });

    async function uploadPost() {
      const postType = document.getElementById("postType").value;
      const title = document.getElementById("title").value.trim();
      const place = document.getElementById("place").value.trim();
      const author = document.getElementById("author").value.trim();
      const content = document.getElementById("content").value.trim();
      const file = document.getElementById("imageInput").files[0];

      if (!title || !content) {
        alert("제목과 내용을 입력하세요.");
        return;
      }

      let imageUrl = "";
      if (file) {
        imageUrl = await uploadImageToR2(file);
        if (file && !imageUrl) return;
      }

      const item = {
        id: String(Date.now()),
        title,
        place,
        author,
        content,
        image: imageUrl,
        date: new Date().toISOString(),
        board: postType
      };

      if (postType === "story") {
        const stories = getStories();
        stories.unshift(item);
        setStories(stories);
      } else if (postType === "notice") {
        const notices = getNotices();
        notices.unshift(item);
        setNotices(notices);
      } else {
        const posts = getPosts();
        posts.unshift(item);
        setPosts(posts);
      }

      resetUploadForm();
      renderAll();
      switchTab("homeTab");
      alert("등록 완료!");
    }

    function resetUploadForm() {
      document.getElementById("postType").value = "news";
      document.getElementById("title").value = "";
      document.getElementById("place").value = "";
      document.getElementById("author").value = "";
      document.getElementById("content").value = "";
      document.getElementById("imageInput").value = "";
    }

    function renderFeatured() {
      const posts = getPosts();
      const featured = posts.slice(0, 8);
      const el = document.getElementById("featuredGrid");

      if (!featured.length) {
        el.innerHTML = '<div class="empty">등록된 소식이 아직 없습니다.</div>';
        return;
      }

      el.innerHTML = featured.map(post => `
        <article class="card" onclick="openDetail('news','${post.id}')">
          ${post.image ? `<img src="${post.image}" alt="${escapeHtml(post.title)}">` : `<div class="thumb-empty">이미지 없음</div>`}
          <div class="card-body">
            <div class="badge">소식</div>
            <div class="title">${escapeHtml(post.title)}</div>
            <div class="meta">
              <span>${formatDate(post.date)}</span>
              ${post.place ? `<span>${escapeHtml(post.place)}</span>` : ""}
            </div>
          </div>
        </article>
      `).join("");
    }

    function renderAllPostsList() {
      const posts = getPosts();
      const el = document.getElementById("allPostsList");

      if (!posts.length) {
        el.innerHTML = '<div class="empty">등록된 소식이 아직 없습니다.</div>';
        return;
      }

      el.innerHTML = posts.map((post, i) => `
        <div class="list-item" onclick="openDetail('news','${post.id}')">
          <div class="list-title">${i + 1}. ${escapeHtml(post.title)}</div>
          <div class="meta">
            <span>${formatDate(post.date)}</span>
            ${post.author ? `<span>작성자 ${escapeHtml(post.author)}</span>` : ""}
            ${post.place ? `<span>${escapeHtml(post.place)}</span>` : ""}
          </div>
        </div>
      `).join("");
    }

    function renderStories() {
      const q = document.getElementById("storySearch") ? document.getElementById("storySearch").value.trim().toLowerCase() : "";
      let stories = getStories();
      if (q) stories = stories.filter(item => item.title.toLowerCase().includes(q) || item.content.toLowerCase().includes(q));
      const el = document.getElementById("storyList");

      if (!stories.length) {
        el.innerHTML = '<div class="empty">등록된 문화이야기가 아직 없습니다.</div>';
        return;
      }

      el.innerHTML = stories.map(item => `
        <div class="list-item" onclick="openDetail('story','${item.id}')">
          <div class="list-title">${escapeHtml(item.title)}</div>
          <div class="meta">
            <span>${formatDate(item.date)}</span>
            ${item.author ? `<span>${escapeHtml(item.author)}</span>` : ""}
          </div>
        </div>
      `).join("");
    }

    function renderNotices() {
      const notices = getNotices();
      const el = document.getElementById("noticeList");
      const homeEl = document.getElementById("homeNotices");

      if (!notices.length) {
        el.innerHTML = '<div class="empty">등록된 공지사항이 아직 없습니다.</div>';
        homeEl.innerHTML = '<div class="empty">등록된 공지사항이 아직 없습니다.</div>';
        return;
      }

      el.innerHTML = notices.map(item => `
        <div class="list-item" onclick="openDetail('notice','${item.id}')">
          <div class="list-title">${escapeHtml(item.title)}</div>
          <div class="meta"><span>${formatDate(item.date)}</span></div>
        </div>
      `).join("");

      homeEl.innerHTML = notices.slice(0, 5).map(item => `
        <div class="small-post" onclick="openDetail('notice','${item.id}')">
          <div class="list-title">${escapeHtml(item.title)}</div>
          <div class="meta"><span>${formatDate(item.date)}</span></div>
        </div>
      `).join("");
    }

    function renderHomeStories() {
      const stories = getStories();
      const homeEl = document.getElementById("homeStories");

      if (!stories.length) {
        homeEl.innerHTML = '<div class="empty">등록된 문화이야기가 아직 없습니다.</div>';
        return;
      }

      homeEl.innerHTML = stories.slice(0, 5).map(item => `
        <div class="small-post" onclick="openDetail('story','${item.id}')">
          <div class="list-title">${escapeHtml(item.title)}</div>
          <div class="meta"><span>${formatDate(item.date)}</span></div>
        </div>
      `).join("");
    }

    function addVideo() {
      const title = document.getElementById("videoTitle").value.trim();
      const url = document.getElementById("videoUrl").value.trim();
      const desc = document.getElementById("videoDesc").value.trim();

      if (!title || !url) {
        alert("영상 제목과 유튜브 링크를 입력하세요.");
        return;
      }

      const embed = getYoutubeEmbed(url);
      if (!embed) {
        alert("유효한 유튜브 링크를 입력하세요.");
        return;
      }

      const videos = getVideos();
      videos.unshift({
        id: String(Date.now()),
        title,
        url,
        embed,
        desc,
        date: new Date().toISOString()
      });
      setVideos(videos);
      resetVideoForm();
      renderVideos();
      alert("영상 등록 완료!");
    }

    function resetVideoForm() {
      document.getElementById("videoTitle").value = "";
      document.getElementById("videoUrl").value = "";
      document.getElementById("videoDesc").value = "";
    }

    function renderVideos() {
      const videos = getVideos();
      const el = document.getElementById("videoList");

      if (!videos.length) {
        el.innerHTML = '<div class="empty">등록된 영상행사가 아직 없습니다.</div>';
        return;
      }

      el.innerHTML = videos.map(v => `
        <div class="list-item">
          <div class="list-title">${escapeHtml(v.title)}</div>
          <div class="meta"><span>${formatDate(v.date)}</span></div>
          <div style="height:12px"></div>
          <iframe width="100%" height="360" src="${v.embed}" title="${escapeHtml(v.title)}" frameborder="0" allowfullscreen style="border-radius:14px;"></iframe>
          ${v.desc ? `<div style="margin-top:10px;">${escapeHtml(v.desc)}</div>` : ""}
          ${isAdmin ? `<div class="admin-row"><button class="danger" onclick="deleteVideo('${v.id}')">삭제</button></div>` : ""}
        </div>
      `).join("");
    }

    function getBoardArray(board) {
      if (board === "story") return getStories();
      if (board === "notice") return getNotices();
      if (board === "video") return getVideos();
      return getPosts();
    }

    function setBoardArray(board, arr) {
      if (board === "story") return setStories(arr);
      if (board === "notice") return setNotices(arr);
      if (board === "video") return setVideos(arr);
      return setPosts(arr);
    }

    function openDetail(board, id) {
      const arr = getBoardArray(board);
      const item = arr.find(v => v.id === id);
      if (!item) return;

      const body = document.getElementById("detailBody");
      body.innerHTML = `
        <div class="badge">${board === "story" ? "문화이야기" : board === "notice" ? "공지사항" : board === "video" ? "영상행사" : "소식"}</div>
        <h2 style="margin:0 0 10px;">${escapeHtml(item.title)}</h2>
        <div class="meta">
          <span>${formatDate(item.date)}</span>
          ${item.author ? `<span>작성자 ${escapeHtml(item.author)}</span>` : ""}
          ${item.place ? `<span>${escapeHtml(item.place)}</span>` : ""}
        </div>
        ${
          board === "video"
            ? `<iframe width="100%" height="420" src="${item.embed}" title="${escapeHtml(item.title)}" frameborder="0" allowfullscreen style="border-radius:16px; margin:16px 0;"></iframe>`
            : item.image
              ? `<img class="detail-image" src="${item.image}" alt="${escapeHtml(item.title)}">`
              : ""
        }
        <div style="white-space:pre-wrap; line-height:1.7;">${escapeHtml(item.content || item.desc || "")}</div>
        ${isAdmin ? `<div class="admin-row"><button class="danger" onclick="deleteItem('${board}','${id}')">삭제</button></div>` : ""}
      `;
      document.getElementById("detailModal").classList.add("show");
    }

    function closeDetail() {
      document.getElementById("detailModal").classList.remove("show");
    }

    function deleteItem(board, id) {
      if (!confirm("정말 삭제하시겠습니까?")) return;
      const arr = getBoardArray(board).filter(item => item.id !== id);
      setBoardArray(board, arr);
      closeDetail();
      renderAll();
    }

    function deleteVideo(id) {
      deleteItem("video", id);
    }

    function seedDataIfEmpty() {
      if (!getNotices().length) {
        setNotices([{
          id: "n1",
          title: "정읍문화소식 안내",
          content: "정읍문화소식은 정읍의 행사와 문화 이야기를 한곳에 모아보는 공간입니다.",
          date: new Date().toISOString()
        }]);
      }
    }

    function renderAll() {
      document.getElementById("adminToggleBtn").textContent = isAdmin ? "관리자 로그아웃" : "관리자 로그인";
      renderFeatured();
      renderAllPostsList();
      renderStories();
      renderNotices();
      renderHomeStories();
      renderVideos();
    }

    seedDataIfEmpty();
    renderAll();
  </script>
</body>
</html>
