<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정읍문화소식</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --paper: #ffffff;
      --text: #1f1f1f;
      --muted: #6b7280;
      --line: #dddddd;
      --brand: #6d4cff;
      --brand-dark: #5337d6;
      --shadow: 0 10px 28px rgba(0,0,0,0.08);
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a { color: inherit; text-decoration: none; }
    img, video { display: block; width: 100%; }
    button, input, textarea, select { font: inherit; }

    .wrap {
      width: min(var(--max), calc(100% - 28px));
      margin: 0 auto;
    }

    header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 0;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand strong {
      font-size: 1.32rem;
      letter-spacing: -0.04em;
      color: #222;
    }

    .brand span {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .menu {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .menu button {
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 0.92rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .menu button:hover,
    .menu button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .hero {
      padding: 22px 0 12px;
    }

    .hero-box {
      position: relative;
      height: 360px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #ddd;
    }

    .hero-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.5));
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #fff;
    }

    .hero-overlay h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
    }

    .hero-overlay p {
      margin: 0;
      font-size: 1rem;
      opacity: 0.96;
    }

    .quick-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 18px 0 26px;
    }

    .quick-row button {
      border: 1px solid var(--line);
      background: #fff;
      padding: 14px 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .quick-row button:hover,
    .quick-row button.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    section {
      padding: 12px 0 24px;
    }

    .section-title {
      margin: 0 0 18px;
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: -0.04em;
    }

    .toolbar {
      background: #fff;
      border: 1px solid var(--line);
      padding: 14px;
      display: grid;
      grid-template-columns: 160px 1fr 110px;
      gap: 10px;
      margin-bottom: 18px;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px 12px;
      color: #222;
    }

    .toolbar button {
      background: #111;
      color: #fff;
      border: 0;
      cursor: pointer;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 12px;
      position: relative;
    }

    .post-admin-actions {
      display: none;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    body.admin-mode .post-admin-actions {
      display: flex;
    }

    .stat-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 2px;
    }

    .thumb {
      aspect-ratio: 3 / 4;
      background: #ececec;
      overflow: hidden;
      position: relative;
    }

    .thumb img,
    .thumb video {
      height: 100%;
      object-fit: cover;
    }

    .type-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      background: rgba(0,0,0,0.72);
      color: #fff;
      padding: 6px 9px;
      font-size: 0.78rem;
      border-radius: 999px;
    }

    .meta {
      margin-top: 10px;
      display: grid;
      gap: 7px;
    }

    .meta .date {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .meta .title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      min-height: 2.8em;
    }

    .meta .place {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1;
      border: 0;
      background: #8b8b8b;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
    }

    .actions button:last-child {
      background: var(--brand);
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-top: 24px;
    }

    .panel h3 {
      margin: 0 0 14px;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
    }

    .notice-list,
    .board-list,
    .video-list {
      display: grid;
      gap: 12px;
    }

    .notice-item,
    .board-item,
    .video-item {
      padding: 12px 0;
      border-bottom: 1px dashed var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .notice-main {
      flex: 1;
      display: grid;
      gap: 6px;
    }

    .notice-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .notice-admin-actions {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    body.admin-mode .notice-admin-actions {
      display: flex;
    }

    .mini-btn {
      border: 1px solid var(--line);
      background: #f3f4f6;
      color: #222;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .mini-btn.danger {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }

    .notice-item:last-child,
    .board-item:last-child,
    .video-item:last-child { border-bottom: 0; }

    .notice-item span,
    .board-item span,
    .video-item span { color: var(--muted); font-size: 0.9rem; }

    .upload-box {
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-top: 24px;
    }

    .upload-box h3 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      letter-spacing: -0.03em;
    }

    .upload-box p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 0.92rem;
      font-weight: 600;
      color: #333;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px 14px;
      color: #222;
      border-radius: 8px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .upload-preview {
      display: none;
      margin-top: 8px;
      max-width: 360px;
      border: 1px solid var(--line);
      overflow: hidden;
      border-radius: 10px;
    }

    .upload-preview.show { display: block; }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 18
