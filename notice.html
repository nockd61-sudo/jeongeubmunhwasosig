
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공지사항</title>
<style>
body {font-family:sans-serif; margin:0;}
.container {padding:20px;}
input, textarea {width:100%; margin-bottom:10px;}
button {padding:10px; background:#6d4cff; color:#fff; border:none;}
.notice {border-bottom:1px solid #ccc; padding:10px 0;}
</style>
</head>
<body>

<nav>
<a href="index.html">홈</a>
<a href="notice.html">공지사항</a>
</nav>

<div class="container">
<h2>공지사항</h2>

<form id="form">
<input id="title" placeholder="제목">
<textarea id="content" placeholder="내용"></textarea>
<button>등록</button>
</form>

<div id="list"></div>
</div>

<script>
document.getElementById("form").onsubmit = e=>{
e.preventDefault();
let t = title.value;
let d = new Date().toISOString().slice(0,10);
list.innerHTML = `<div class="notice"><b>${t}</b> (${d})</div>` + list.innerHTML;
}
</script>

</body>
</html>
