<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>정읍 뉴스 승인 | 정읍문화소식</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #24302b; background: #f5f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(980px, calc(100% - 32px)); margin: 36px auto 80px; }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin-bottom: 8px; }
    p { line-height: 1.6; color: #52615a; }
    .panel { background: white; padding: 24px; border: 1px solid #d9e2dc; border-radius: 18px; margin-top: 20px; }
    input[type=password] { width: min(100%, 340px); padding: 12px; border: 1px solid #bbc9bf; border-radius: 10px; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; background: #176548; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button.secondary { color: #176548; background: #e4f1e9; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
    #list { display: grid; gap: 12px; margin: 16px 0; }
    .item { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid #d9e2dc; border-radius: 12px; background: #fff; }
    .item.selected { border-color: #176548; background: #f0f8f2; }
    .item input { margin-top: 5px; width: 19px; height: 19px; }
    .item strong { display: block; line-height: 1.5; }
    .item small { display: block; margin-top: 8px; color: #586760; }
    .item a { color: #176548; }
    #status { min-height: 25px; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <a href="/">← 정읍문화소식</a>
  <h1>오늘의 정읍 뉴스 승인</h1>
  <p>기사 후보를 확인하고 3개를 선택해 게시합니다. 원문은 제목을 눌러 확인하세요.</p>
  <section id="loginPanel" class="panel" hidden>
    <h2>관리자 로그인</h2>
    <form id="loginForm">
      <input id="password" type="password" autocomplete="current-password" aria-label="관리자 비밀번호" required>
      <button type="submit">로그인</button>
    </form>
  </section>
  <section id="adminPanel" class="panel" hidden>
    <h2 id="dateLabel">기사 후보</h2>
    <p>최근 정읍 기사를 가져와 AI가 관심도가 높을 만한 순서로 추천합니다. 최종 게시 기사는 직접 결정합니다.</p>
    <div class="actions">
      <button id="refreshBtn" type="button">새 기사 후보 찾기</button>
      <button id="publishBtn" type="button">선택한 3개 게시</button>
      <button id="logoutBtn" type="button" class="secondary">로그아웃</button>
    </div>
    <div id="list"></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
const endpoint = '/api/news-admin';
const statusBox = document.getElementById('status');
let items = [];
async function call(data) {
  const response = await fetch(endpoint, {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || '요청에 실패했습니다.');
  return result;
}
function message(text) { statusBox.textContent = text; }
function busy(value) { for (const b of document.querySelectorAll('button')) b.disabled = value; }
async function load() {
  const response = await fetch(endpoint, { credentials: 'same-origin', cache: 'no-store' });
  if (response.status === 401) {
    document.getElementById('loginPanel').hidden = false;
    document.getElementById('adminPanel').hidden = true;
    return;
  }
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '불러오기에 실패했습니다.');
  document.getElementById('loginPanel').hidden = true;
  document.getElementById('adminPanel').hidden = false;
  document.getElementById('dateLabel').textContent = data.day + ' 기사 후보';
  items = data.news || [];
  const list = document.getElementById('list');
  list.replaceChildren();
  if (!items.length) { list.textContent = '후보가 없습니다. 새 기사 후보 찾기를 눌러주세요.'; return; }
  for (const item of items) {
    const row = document.createElement('label');
    row.className = 'item';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox'; checkbox.value = item.id;
    checkbox.checked = item.approved_day === data.day;
    checkbox.addEventListener('change', () => {
      row.classList.toggle('selected', checkbox.checked);
      if (list.querySelectorAll('input:checked').length > 3) {
        checkbox.checked = false; row.classList.remove('selected');
        message('기사는 3개까지 선택할 수 있습니다.');
      }
    });
    row.classList.toggle('selected', checkbox.checked);
    const body = document.createElement('div');
    const link = document.createElement('a');
    link.href = item.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.textContent = item.title;
    const strong = document.createElement('strong'); strong.append(link);
    const small = document.createElement('small');
    small.textContent = item.source + ' · ' + item.published_at.slice(0, 10) + (checkbox.checked ? ' · 현재 게시 중' : '');
    body.append(strong, small); row.append(checkbox, body); list.append(row);
  }
}
document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault(); busy(true);
  try {
    await call({ action: 'login', password: document.getElementById('password').value });
    document.getElementById('password').value = '';
    message('로그인했습니다.'); await load();
  } catch (error) { message(error.message); } finally { busy(false); }
});
document.getElementById('refreshBtn').addEventListener('click', async () => {
  busy(true); message('기사 후보를 찾는 중입니다.');
  try {
    const data = await call({ action: 'refresh' });
    await load();
    message(data.count + '개 후보를 찾았습니다.' + (data.usedAi ? ' AI 추천 순서로 표시합니다.' : ' AI 연결이 없거나 응답하지 않아 최신순으로 표시합니다.'));
  } catch (error) { message(error.message); } finally { busy(false); }
});
document.getElementById('publishBtn').addEventListener('click', async () => {
  const ids = [...document.querySelectorAll('#list input:checked')].map(input => Number(input.value));
  if (ids.length !== 3) { message('기사 3개를 선택하세요.'); return; }
  busy(true);
  try { await call({ action: 'publish', ids }); await load(); message('선택한 기사 3개가 오늘의 뉴스에 게시됐습니다.'); }
  catch (error) { message(error.message); } finally { busy(false); }
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await call({ action: 'logout' }); await load(); message('로그아웃했습니다.'); }
  catch (error) { message(error.message); }
});
load().catch(error => message(error.message));
</script>
</body>
</html>
